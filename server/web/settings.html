<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet settings</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f4ef; --card:#fff; --ink:#22201c; --dim:#77726a; --accent:#e8743b;
          --line:#e2ded5; --good:#2f8f5b; --bad:#c2412d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1a18; --card:#262421; --ink:#eeeae2; --dim:#9a948a; --line:#38352f;
          --good:#5cc08a; --bad:#ec7a63; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { max-width:820px; margin:0 auto; padding:18px 16px 4px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; }
  header nav { margin-left:auto; display:flex; gap:14px; }
  header a { color:var(--accent); }
  main { max-width:820px; margin:0 auto; padding:12px 16px 40px; display:flex; flex-direction:column; gap:14px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 6px; }
  .field { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:4px 16px; align-items:center; padding:10px 0;
           border-bottom:1px solid var(--line); }
  .field:last-child { border-bottom:0; }
  .field label { font-weight:500; }
  .field .hint { grid-column:1 / -1; color:var(--dim); font-size:12px; }
  .field .msg { grid-column:1 / -1; font-size:12px; min-height:0; }
  .field .msg:empty { display:none; }
  .field.wide { grid-template-columns:1fr; }
  .msg.bad { color:var(--bad); } .msg.good { color:var(--good); }
  input[type=text], input[type=number], input[type=time], textarea {
    padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; }
  input[type=number] { width:90px; }
  input[type=text] { width:220px; max-width:100%; }
  textarea { width:100%; min-height:70px; resize:vertical; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; flex-wrap:wrap; }
  .seg label { padding:6px 12px; cursor:pointer; font-weight:400; border-right:1px solid var(--line); user-select:none; }
  .seg label:last-child { border-right:0; }
  .seg input { position:absolute; opacity:0; pointer-events:none; }
  .seg label:has(input:checked) { background:var(--accent); color:#fff; }
  .seg label:has(input:focus-visible) { outline:2px solid var(--accent); outline-offset:-2px; }
  .switch { position:relative; width:42px; height:24px; flex:none; }
  .switch input { position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; }
  .switch span { position:absolute; inset:0; border-radius:12px; background:var(--line); transition:background .15s; pointer-events:none; }
  .switch span::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff;
                        transition:transform .15s; box-shadow:0 1px 2px #0003; }
  .switch input:checked + span { background:var(--accent); }
  .switch input:checked + span::after { transform:translateX(18px); }
  .switch input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }
  #silent-now { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:var(--bg); margin:4px 0 6px; }
  #silent-now b { font-size:15px; }
  #silent-now .dot { width:10px; height:10px; border-radius:50%; background:var(--good); flex:none; }
  #silent-now.on .dot { background:var(--accent); }
  .ways { color:var(--dim); font-size:12px; margin:0; }
  kbd { font:12px ui-monospace, monospace; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 4px; }
  @media (max-width:560px) { .field { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header><h1 id="title">Settings</h1><nav><a href="/">Chat and lists</a><a href="/status">Status</a></nav></header>
<main id="main"><section>Loading…</section></main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// How the settings are grouped and named on this page. Any setting not listed here appears under "Other".
const GROUPS = [
  ['Silent mode', ['silent_mode', 'office_days']],
  ['You and your day', ['user_name', 'work_start', 'work_end']],
  ['Quiet hours', ['quiet_start', 'quiet_end']],
  ['Briefing and wrap-up', ['briefing_enabled', 'briefing_time', 'wrapup_enabled', 'wrapup_time']],
  ['Reminders and meetings', ['nudge_lead_minutes', 'meeting_lead_minutes', 'meeting_followup_enabled', 'meeting_quiet_enabled']],
  ['Breaks', ['break_every_minutes', 'water_every_minutes']],
  ['Tasks and writing', ['stale_task_days', 'writing_style']],
];
const LABELS = {
  silent_mode: 'Silent mode', office_days: 'Office days',
  user_name: 'Your name', work_start: 'Work starts', work_end: 'Work ends',
  quiet_start: 'Quiet hours start', quiet_end: 'Quiet hours end',
  briefing_enabled: 'Morning briefing', briefing_time: 'Briefing time',
  wrapup_enabled: 'End-of-day wrap-up', wrapup_time: 'Wrap-up time',
  nudge_lead_minutes: 'Warn before a task is due (minutes)', meeting_lead_minutes: 'Warn before a meeting (minutes)',
  meeting_followup_enabled: 'Offer to take notes after meetings', meeting_quiet_enabled: 'Stay silent during calendar meetings',
  break_every_minutes: 'Stretch break every (minutes)', water_every_minutes: 'Water reminder every (minutes)',
  stale_task_days: 'A task is stale after (days)', writing_style: 'Your writing style',
};
const HINTS = {
  silent_mode: 'Shows every message in the speech bubble instead of speaking it. Office days: silent during work hours on the days below.',
  office_days: 'Used when silent mode is set to office days, between the work hours under "You and your day".',
};
const DAYS = [['mon', 'Mon'], ['tue', 'Tue'], ['wed', 'Wed'], ['thu', 'Thu'], ['fri', 'Fri'], ['sat', 'Sat'], ['sun', 'Sun']];
let data = null;

function control(key, value) {
  if (key === 'silent_mode') {
    return `<div class="seg" role="radiogroup" aria-label="Silent mode">${[['off', 'Off'], ['on', 'On'], ['office_days', 'Office days']]
      .map(([v, t]) => `<label><input type="radio" name="silent_mode" value="${v}" ${value === v ? 'checked' : ''}>${t}</label>`).join('')}</div>`;
  }
  if (key === 'office_days') {
    const on = value.split(',');
    return `<div class="seg" role="group" aria-label="Office days">${DAYS.map(([v, t]) =>
      `<label><input type="checkbox" name="office_days" value="${v}" ${on.includes(v) ? 'checked' : ''}>${t}</label>`).join('')}</div>`;
  }
  if (key.endsWith('_enabled')) {
    return `<span class="switch"><input type="checkbox" id="f-${key}" ${value === 'on' ? 'checked' : ''}><span></span></span>`;
  }
  if (/_(time|start|end)$/.test(key)) return `<input type="time" id="f-${key}" value="${esc(value)}">`;
  if (/_(minutes|days)$/.test(key)) return `<input type="number" id="f-${key}" min="0" max="${key.endsWith('_days') ? 365 : 240}" value="${esc(value)}">`;
  if (key === 'writing_style') return `<textarea id="f-${key}" maxlength="1000">${esc(value)}</textarea>`;
  return `<input type="text" id="f-${key}" value="${esc(value)}">`;
}

function field(key) {
  const wide = key === 'writing_style';
  const hint = HINTS[key] || data.descriptions[key] || '';
  return `<div class="field${wide ? ' wide' : ''}" data-key="${key}">
    <label for="f-${key}">${esc(LABELS[key] || key.replaceAll('_', ' '))}</label>${control(key, data.values[key] || '')}
    <div class="hint">${esc(hint)}</div><div class="msg" role="status"></div></div>`;
}

function read(key) {
  const box = document.querySelector(`.field[data-key="${key}"]`);
  if (key === 'silent_mode') return box.querySelector('input:checked')?.value || 'off';
  if (key === 'office_days') return [...box.querySelectorAll('input:checked')].map((i) => i.value).join(',');
  const input = $('f-' + key);
  return input.type === 'checkbox' ? (input.checked ? 'on' : 'off') : input.value;
}

function showSilent() {
  const s = data.silent;
  $('silent-now').className = s.on ? 'on' : '';
  $('silent-now').innerHTML = `<span class="dot"></span><span><b>${s.on ? `${esc(data.name)} is silent now` : `${esc(data.name)} speaks now`}</b>
    <span class="hint" style="color:var(--dim)"> — ${esc(s.reason)}</span></span>`;
  document.querySelector('.field[data-key="office_days"]').style.opacity = data.values.silent_mode === 'office_days' ? '' : '.55';
}

function render() {
  $('title').textContent = `${data.name} settings`;
  const listed = new Set(GROUPS.flatMap(([, keys]) => keys));
  const other = Object.keys(data.values).filter((k) => !listed.has(k));
  const groups = other.length ? [...GROUPS, ['Other', other]] : GROUPS;
  $('main').innerHTML = groups.map(([name, keys], i) => `<section><h2>${esc(name)}</h2>
    ${i === 0 ? `<div id="silent-now"></div><p class="ways">Also: <kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>M</kbd>, the tray menu, or say
      "silent mode on" / "silent mode off". On an office day those switch it for that day only.</p>` : ''}
    ${keys.filter((k) => k in data.values).map(field).join('')}</section>`).join('');
  showSilent();
  document.querySelectorAll('.field').forEach((box) => {
    const key = box.dataset.key;
    box.addEventListener('change', () => save(key, box));
  });
}

async function save(key, box) {
  const msg = box.querySelector('.msg');
  const value = read(key);
  msg.className = 'msg'; msg.textContent = 'Saving…';
  try {
    const res = await fetch('/api/settings', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ [key]: value }) });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    const out = await res.json();
    data.values = out.values; data.silent = out.silent;
    if (out.errors[key]) { msg.className = 'msg bad'; msg.textContent = out.errors[key]; return; }
    msg.className = 'msg good'; msg.textContent = 'Saved';
    setTimeout(() => { if (msg.textContent === 'Saved') msg.textContent = ''; }, 2000);
    showSilent();
  } catch (e) {
    msg.className = 'msg bad'; msg.textContent = `Could not save: ${e.message}`;
  }
}

async function load() {
  try {
    const res = await fetch('/api/settings');
    data = await res.json();
    render();
  } catch (e) {
    $('main').innerHTML = `<section>Could not reach the pet's server: ${esc(e.message)}</section>`;
  }
}

// Keep the "silent now" line current (office hours start and end, the hotkey) without touching the form.
setInterval(async () => {
  if (!data) return;
  try { const fresh = await (await fetch('/api/settings')).json(); data.silent = fresh.silent; data.values.silent_mode = fresh.values.silent_mode;
    const radio = document.querySelector(`input[name=silent_mode][value="${fresh.values.silent_mode}"]`);
    if (radio) radio.checked = true;
    showSilent(); } catch {}
}, 15000);
load();
</script>
</body>
</html>
