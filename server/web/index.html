<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop Pet chat</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f4ef; --card:#fff; --ink:#22201c; --dim:#77726a; --accent:#e8743b; --line:#e2ded5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1a18; --card:#262421; --ink:#eeeae2; --dim:#9a948a; --line:#38352f; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:920px; margin:0 auto; padding:16px; display:grid; grid-template-columns:1fr 280px; gap:16px; height:100vh; }
  @media (max-width:720px) { main { grid-template-columns:1fr; height:auto; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; min-height:0; }
  #chat { display:flex; flex-direction:column; }
  #log { flex:1; overflow:auto; display:flex; flex-direction:column; gap:8px; min-height:300px; }
  .msg { max-width:80%; padding:8px 12px; border-radius:12px; white-space:pre-wrap; }
  .me { align-self:flex-end; background:var(--accent); color:#fff; }
  .pet { align-self:flex-start; background:var(--bg); }
  .note { align-self:center; color:var(--dim); font-size:13px; }
  form { display:flex; gap:8px; margin-top:10px; }
  input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; }
  button { padding:10px 16px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 6px; }
  ul { list-style:none; padding:0; margin:0 0 16px; }
  li { padding:6px 0; border-bottom:1px solid var(--line); }
  li small { display:block; color:var(--dim); }
  #status { color:var(--dim); font-size:13px; }
  #side { overflow:auto; }
  details { margin-bottom:16px; }
  summary { cursor:pointer; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin-bottom:6px; }
  textarea { width:100%; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:13px/1.4 system-ui, sans-serif; resize:vertical; margin-bottom:6px; }
  .hint { color:var(--dim); font-size:12px; margin:0 0 6px; }
  #writing-save { padding:6px 12px; font-size:13px; }
  #writing-msg { color:var(--dim); font-size:12px; margin-left:6px; }
  .rewrite small { white-space:pre-wrap; }
</style>
</head>
<body>
<main>
  <section id="chat">
    <div id="status">Connecting…</div>
    <div id="log"></div>
    <form id="form"><input id="box" placeholder="Type a message" autocomplete="off" autofocus><button>Send</button></form>
  </section>
  <section id="side">
    <h2>Reminders</h2><ul id="reminders"></ul>
    <h2>Todos</h2><ul id="todos"></ul>
    <details id="writing">
      <summary>My writing style</summary>
      <p class="hint">Used when you select text and press Ctrl+Alt+R. Describe how you write, and paste a few things you wrote yourself and are happy with.</p>
      <textarea id="style" rows="3" maxlength="1000" placeholder="e.g. Direct and polite. A bit informal with my team, more formal with clients. Short sentences, no fluff."></textarea>
      <div id="samples"></div>
      <button id="writing-save" type="button">Save</button><span id="writing-msg"></span>
      <h2 style="margin-top:14px">Recent rewrites</h2><ul id="rewrites"></ul>
    </details>
  </section>
</main>
<script>
const log = document.getElementById('log'), status = document.getElementById('status');
let ws, current = null;

function add(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls; el.textContent = text;
  log.append(el); log.scrollTop = log.scrollHeight;
  return el;
}

async function refresh() {
  const data = await (await fetch('/api/overview')).json();
  for (const [id, items, label] of [['reminders', data.reminders, r => r.text], ['todos', data.todos, t => t.title]]) {
    const ul = document.getElementById(id); ul.replaceChildren();
    if (!items.length) { const li = document.createElement('li'); li.textContent = 'Nothing yet'; ul.append(li); }
    for (const item of items) {
      const li = document.createElement('li'); li.textContent = label(item);
      const small = document.createElement('small'); small.textContent = item.due; li.append(small); ul.append(li);
    }
  }
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { status.textContent = 'Connected'; };
  ws.onclose = () => { status.textContent = 'Disconnected, retrying…'; setTimeout(connect, 2000); };
  ws.onmessage = (e) => {
    if (typeof e.data !== 'string') return;
    const m = JSON.parse(e.data);
    if (m.type === 'hello') status.textContent = `Connected to ${m.name}` + (m.voice ? '' : ' (voice service offline)');
    else if (m.type === 'state' && m.state === 'thinking') { current = add('pet', '…'); current.dataset.empty = '1'; }
    else if (m.type === 'reply_delta' && current) {
      if (current.dataset.empty) { current.textContent = ''; delete current.dataset.empty; }
      current.textContent += m.text; log.scrollTop = log.scrollHeight;
    }
    else if (m.type === 'reply_done') { if (current) current.textContent = m.text; current = null; refresh(); }
    else if (m.type === 'notify') { add('note', `${m.title}: ${m.body}`); refresh(); }
    else if (m.type === 'error') { if (current) current.remove(); current = null; add('note', m.message); }
  };
}

document.getElementById('form').onsubmit = (e) => {
  e.preventDefault();
  const box = document.getElementById('box'), text = box.value.trim();
  if (!text || ws.readyState !== 1) return;
  add('me', text); box.value = '';
  ws.send(JSON.stringify({ type: 'text', text }));
};

async function loadHistory() {
  const data = await (await fetch('/api/history?limit=60')).json();
  let day = '';
  for (const m of data.messages) {
    const d = m.when.slice(0, 15);
    if (d !== day) { day = d; add('note', d); }
    add(m.role === 'user' ? 'me' : (m.role === 'pet' || m.role === 'result') ? 'pet' : 'note', m.role === 'announce' ? `${m.when.slice(-5)} · ${m.text}` : m.text);
  }
}

// ---- writing style for Ctrl+Alt+R ----
const SAMPLE_SLOTS = 5;
async function loadWriting() {
  const data = await (await fetch('/api/writing')).json();
  document.getElementById('style').value = data.style || '';
  const box = document.getElementById('samples'); box.replaceChildren();
  for (let i = 0; i < SAMPLE_SLOTS; i++) {
    const t = document.createElement('textarea');
    t.rows = 3; t.maxLength = 2000; t.placeholder = `Sample ${i + 1} of your own writing`; t.value = data.samples[i] || '';
    box.append(t);
  }
  const ul = document.getElementById('rewrites'); ul.replaceChildren();
  if (!data.recent.length) { const li = document.createElement('li'); li.textContent = 'None since the server started'; ul.append(li); }
  for (const r of data.recent) {
    const li = document.createElement('li'); li.className = 'rewrite'; li.textContent = r.result;
    const small = document.createElement('small'); small.textContent = `${r.at} · was: ${r.original}`; li.append(small); ul.append(li);
  }
}
document.getElementById('writing').addEventListener('toggle', (e) => { if (e.target.open) loadWriting().catch(() => {}); });
document.getElementById('writing-save').onclick = async () => {
  const msg = document.getElementById('writing-msg');
  const samples = [...document.querySelectorAll('#samples textarea')].map(t => t.value.trim()).filter(Boolean);
  const res = await fetch('/api/writing', { method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ style: document.getElementById('style').value, samples }) });
  msg.textContent = res.ok ? 'Saved' : ((await res.json().catch(() => ({}))).detail || 'Could not save');
  if (res.ok) loadWriting().catch(() => {});
  setTimeout(() => { msg.textContent = ''; }, 3000);
};

loadHistory().catch(() => {}).then(connect); refresh(); setInterval(refresh, 30000);
</script>
</body>
</html>
